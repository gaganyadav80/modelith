name: modelith_generator
description: Code generator for the modelith package — turns @Model into fromJson/toJson, copyWith and Equatable props in one part file.
version: 0.1.0
repository: https://github.com/gaganyadav80/modelith

environment:
  sdk: ^3.10.0

dependencies:
  analyzer: ^13.3.0
  build: ^4.0.0
  json_annotation: ^4.12.0
  json_serializable: ^6.14.0
  modelith: ^0.1.0
  source_gen: ^4.2.0

dev_dependencies:
  build_runner: ^2.15.0
  build_test: ^3.0.0
  lints: ^6.0.0
  test: ^1.25.0

dependency_overrides:
  modelith:
    path: ../modelith
